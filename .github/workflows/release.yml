# Builds, signs and notarizes PairMagic, then publishes a GitHub release with the DMG.
#
# Runs on every push to main (except docs-only changes), or by hand from the Actions tab.
#   - The version bumps the patch number of the newest vX.Y.Z tag. Put #minor or #major in a commit
#     message to bump that instead, or raise MARKETING_VERSION in the project to jump ahead.
#   - Put [skip release] (or [skip ci]) in the commit message to push without releasing.
#
# Secrets it needs are listed in README › Releasing › Automatic releases.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "Design/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

# One release at a time, so two quick pushes can't claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # all tags and history, to work out the version

      - name: Work out the version
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          bump="${INPUT_BUMP:-patch}"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Look at every commit in this push (falling back to the last one after a force-push).
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"; else range="-1 HEAD"; fi
            messages=$(git log --format=%B $range)
            if grep -q '#major' <<<"$messages"; then bump=major
            elif grep -q '#minor' <<<"$messages"; then bump=minor; fi
          fi
          version=$(scripts/next-version.sh "$bump")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"; exit 1
          fi
          echo "Releasing $version ($bump bump), build $GITHUB_RUN_NUMBER"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install the signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          [ -n "$P12_BASE64" ] || { echo "::error::The DEVELOPER_ID_P12_BASE64 secret isn't set"; exit 1; }
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -P "$RUNNER_TEMP/cert.p12"
          # Apple's Developer ID intermediate, so codesign can build the full chain. A .p12 exported
          # from Keychain Access usually includes it already, which makes this import report a duplicate.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          if ! output=$(security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" 2>&1); then
            [[ "$output" == *"already exists"* ]] || { echo "$output"; exit 1; }
            echo "Developer ID intermediate certificate already included in the .p12"
          fi

          # Let codesign use the key without a prompt, and put the keychain in the search list.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Save the notarization credentials
        env:
          API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          if [ -n "$API_KEY_P8" ]; then
            printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            xcrun notarytool store-credentials PairMagic-Notary --keychain "$KEYCHAIN" \
              --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
            rm -P "$RUNNER_TEMP/AuthKey.p8"
          elif [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials PairMagic-Notary --keychain "$KEYCHAIN" \
              --apple-id "$APPLE_ID" --team-id B4H429V95D --password "$APP_PASSWORD"
          else
            echo "::error::Set either the NOTARY_API_KEY_* secrets or NOTARY_APPLE_ID and NOTARY_APP_PASSWORD"
            exit 1
          fi

      - name: Build, sign and notarize
        env:
          NOTARY_KEYCHAIN: ${{ env.KEYCHAIN }}
        run: scripts/release.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="build/release/PairMagic-$VERSION.dmg"
          (cd build/release && shasum -a 256 "PairMagic-$VERSION.dmg" > "PairMagic-$VERSION.dmg.sha256")
          gh release create "v$VERSION" "$dmg" "$dmg.sha256" \
            --target "$GITHUB_SHA" --title "PairMagic $VERSION" --generate-notes

      - name: Remove the keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
